<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<header class="relative h-[60px] w-full max-w-[1920px] mx-auto flex items-center justify-between px-4 overflow-hidden">

  <div class="pointer-events-none absolute inset-0 z-0">

    <div class="absolute inset-0 h-[60px] bg-[linear-gradient(90deg,#ffffff_42%,#ffdfe4_62%,#b00012_86%,#8f000f_100%)]">
    </div>

    <!-- Trống đồng -->
    <div
      class="absolute left-[75.1px] top-[-171.7px] w-[389.5244px] h-[439.3898px] opacity-70 bg-[url('/assets/trongdong.png')] bg-no-repeat bg-center bg-contain">
    </div>


    <div class="absolute right-0 top-0 h-[60px] w-[1200px] overflow-hidden">
      <img src="/assets/image89.png" alt="" draggable="false"
        class="absolute top-0 left-[64px] w-[1138.0390625px] h-[60px] rotate-180 opacity-70 mix-blend-soft-light object-cover object-[right_center] select-none" />
      <img src="/assets/anhmenu.png" alt="" draggable="false"
        class="absolute top-0 left-[184.12px] w-[1117.8765869140625px] h-[60px] rotate-180 opacity-70 mix-blend-soft-light object-cover object-[right_top] select-none" />
    </div>



  </div>

  <!--  Menu + Logo + Text -->
  <div class="relative z-10 flex items-center gap-3">
    <button class="w-9 h-9 grid place-content-center rounded-md hover:bg-white/15" (click)="sidebar.toggle()"
      aria-label="Toggle sidebar">
      <span class="block w-[18px] h-[2px] bg-gray-800 mb-1"></span>
      <span class="block w-[18px] h-[2px] bg-gray-800 mb-1"></span>
      <span class="block w-[18px] h-[2px] bg-gray-800"></span>
    </button>

    <img src="/assets/logovn.png" class="h-9" alt="VN Flag" />
    <div class="leading-none">
      <h1 class="text-[18px] font-extrabold text-[#c70016]">iCPV Reputa</h1>
      <p class="mt-0.5 text-[13px] font-bold text-[#113147]">Hệ thống ứng dụng Tài Chính, Tài sản Đảng</p>
    </div>
  </div>


  <div class="relative z-10 flex items-center text-white">

    <button class="relative w-9 h-9 grid place-content-center hover:bg-white/15 rounded-md">
      <i class="bi bi-bell text-[18px]"></i>
      <span
        class="absolute -top-0.5 -right-0.5 min-w-[14px] h-[14px] px-[3px] grid place-items-center text-[9px] leading-none bg-[#ff3b3b] text-white rounded-full border-[1.5px] border-white">0</span>
    </button>


    <button class="w-9 h-9 grid place-content-center hover:bg-white/15 rounded-md ml-1">
      <i class="bi bi-arrow-clockwise text-[18px]"></i>
    </button>


    <span class="mx-3 h-5 w-px bg-white/60"></span>


    <button class="flex items-center gap-2 hover:bg-white/15 rounded-md h-9 px-2">
      <i class="bi bi-person-circle text-[18px]"></i>
      <span class="text-[14px] font-semibold">Admin</span>
      <i class="bi bi-caret-down-fill text-[11px]"></i>
    </button>
  </div>
</header>
